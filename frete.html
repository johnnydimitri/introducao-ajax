<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="container">
        <form>
            <div class="row mt-5">
                <h4>Dados Basicos</h4>
            </div>
            <div class="row">
                <div class="col-3">
                    <input type="text" class="form-control" placeholder="nome">
                </div>
                <div class="col-5">
                    <input type="text" class="form-control" placeholder="sobrenome">
                </div>
                <div class="col-4">
                    <input type="email" class="form-control" placeholder="email">
                </div>
                <div class="row mt-3">
                    <h4>Dados da entrega</h4>
                </div>
                <div class="row mb-5">
                    <div class="col-3 d-flex">
                        <input type="text" class="form-control" placeholder="cep" id="cep">
                        <button type="button" class="btn btn-primary" id="btn-buscar-cep">
                            <i class="bi bi-search"></i>
                            <span class="d-none spinner-border spinner-border-m"></span>
                        </button>
                    </div>
                    <div class="col-7">
                        <input type="text" class="form-control" placeholder="endereço" id="endereco">
                    </div>
                    <div class="col-2">
                        <input type="number" class="form-control" placeholder="numero">
                    </div>
                </div>
                <button type="submit" class="btn btn-success col-3">Enviar pedido</button>
            </div>
        </form>
    </div>

    <script src="jquery.js"></script>
    <script src="jquery.mask.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
